name: Staging

# Deploys ONE trusted pull request at a time to the shared Ghost staging site.
#
# - Trusted: the PR comes from a branch of this repository (never a fork) and
#   carries the "staging" label, which only people with triage/write access
#   can set. The "staging" GitHub environment can add a manual approval.
# - Lock: the label is the lock. If another open PR already carries it,
#   the deploy fails and names that PR.
# - Release: when the PR holding the label is closed or unlabeled, main is
#   redeployed so staging never stays on an abandoned branch.
#
# Only the staging environment's secret and variables are used here.
# This workflow must never reference the production site.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  STAGING_LABEL: staging

jobs:
  plan:
    name: Plan
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.plan.outputs.target }}
      ref: ${{ steps.plan.outputs.ref }}
      source: ${{ steps.plan.outputs.source }}
    steps:
      - name: Decide what to deploy
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, env.STAGING_LABEL) }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          target="none"
          if [ "$EVENT" = workflow_dispatch ]; then
            target="main"
          elif [ "$ACTION" = closed ] && [ "$HAS_LABEL" = true ]; then
            target="main"
          elif [ "$ACTION" = unlabeled ] && [ "$EVENT_LABEL" = "$STAGING_LABEL" ]; then
            target="main"
          elif [ "$ACTION" = labeled ] && [ "$EVENT_LABEL" = "$STAGING_LABEL" ]; then
            target="pr"
          elif [ "$HAS_LABEL" = true ] && [[ "$ACTION" =~ ^(opened|synchronize|reopened)$ ]]; then
            target="pr"
          fi

          if [ "$target" = pr ]; then
            echo "ref=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "source=PR #$PR" >> "$GITHUB_OUTPUT"
          elif [ "$target" = main ]; then
            echo "ref=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
            echo "source=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "Staging target: $target"

  validate:
    name: Validate
    needs: plan
    if: needs.plan.outputs.target != 'none'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      zip: ${{ steps.meta.outputs.zip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build, zip and check with gscan
        run: pnpm test:ci

      - name: Record build metadata
        id: meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "zip=dist/$(jq -r .name package.json).zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theme
          path: ${{ steps.meta.outputs.zip }}
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to staging
    needs: [plan, validate]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.lock.outputs.url }}
    # One deploy at a time on the shared site; never cancel one mid-upload
    concurrency:
      group: ghost-staging
      cancel-in-progress: false
    steps:
      - name: Check configuration and staging lock
        id: lock
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET: ${{ needs.plan.outputs.target }}
          PR: ${{ github.event.pull_request.number }}
          STAGING_URL: ${{ vars.GHOST_STAGING_URL }}
          HAS_KEY: ${{ secrets.GHOST_STAGING_ADMIN_API_KEY != '' }}
        run: |
          if [ -z "$STAGING_URL" ] || [ "$HAS_KEY" != true ]; then
            echo "::error::Set the GHOST_STAGING_URL variable and the GHOST_STAGING_ADMIN_API_KEY secret on the 'staging' environment."
            exit 1
          fi
          echo "url=$STAGING_URL" >> "$GITHUB_OUTPUT"

          # Re-read the lock now that this job holds the concurrency group
          holders=$(gh pr list --repo "$REPO" --state open --label "$STAGING_LABEL" --json number)
          others=$(jq -r --argjson pr "${PR:-0}" '[.[].number | select(. != $pr) | "#\(.)"] | join(" ")' <<<"$holders")
          holds=$(jq --argjson pr "${PR:-0}" 'any(.[]; .number == $pr)' <<<"$holders")

          skip=false
          if [ "$TARGET" = pr ]; then
            if [ -n "$others" ]; then
              echo "::error::Staging is already held by $others. Remove the '$STAGING_LABEL' label from one of the PRs, then push or re-label to deploy."
              exit 1
            fi
            if [ "$holds" != true ]; then
              echo "::notice::PR #$PR is closed or no longer labeled '$STAGING_LABEL', nothing to deploy."
              skip=true
            fi
          elif [ -n "$others" ]; then
            echo "::notice::Staging is held by $others, main is not redeployed."
            skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.lock.outputs.skip != 'true'
        with:
          name: theme
          path: dist

      - name: Upload theme to Ghost staging
        if: steps.lock.outputs.skip != 'true'
        uses: TryGhost/action-deploy-theme@b1ff2a5eeac1d5438a0aab35eb996fe4010d889e # v2.0.4
        with:
          api-url: ${{ vars.GHOST_STAGING_ADMIN_URL || vars.GHOST_STAGING_URL }}
          api-key: ${{ secrets.GHOST_STAGING_ADMIN_API_KEY }}
          file: ${{ needs.validate.outputs.zip }}

      - name: Write summary
        if: always() && steps.lock.outputs.url != ''
        env:
          STAGING_URL: ${{ steps.lock.outputs.url }}
          SOURCE: ${{ needs.plan.outputs.source }}
          SHA: ${{ needs.validate.outputs.sha }}
          SKIPPED: ${{ steps.lock.outputs.skip }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$SKIPPED" = true ]; then
            status="skipped, see the notice above"
          else
            status="$OUTCOME"
          fi
          {
            echo "### Ghost staging"
            echo
            echo "- Staging URL: $STAGING_URL"
            echo "- Source: $SOURCE at \`${SHA:0:7}\`"
            echo "- Deploy: $status"
          } >> "$GITHUB_STEP_SUMMARY"
